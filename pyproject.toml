[project]
name = "press_k3s"
authors = [
    { name = "Ahmed", email = "ahmed3mageed@gmail.com"}
]
description = "Press adapter for kagent (k3s Frappe agent)"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
press = ">=0.7.0"
